# Runs daily at 12:10
name: Security audit
on:
  schedule:
    - cron:  '10 12 * * *'
permissions:
  contents: read
jobs:
  security_audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Pre-installed so the action finds it instead of running an unpinned `cargo install`
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit@0.22.2
      # Cargo.lock is not committed, and the action audits `Cargo.lock`
      - name: Generate lockfile
        run: cargo generate-lockfile
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
