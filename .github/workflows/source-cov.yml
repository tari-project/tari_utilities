name: Source Coverage
on:
  push:
    branches:
      - main
env:
  RUSTUP_TOOLCHAIN: "stable"
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y jq lcov
      - name: Download Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: llvm-tools-preview
      - name: Install requirements for code coverage
        run: |
          cargo install --locked cargo-binutils@0.4.0
          cargo install --locked rustfilt@0.2.1
      - name: Run test coverage
        id: coverage
        env:
          SKIP_HTML: "1"
        run: |
          /bin/bash -c ./test_coverage.sh
      - name: Coveralls upload
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./cov_raw/tari_utilities.lcov
